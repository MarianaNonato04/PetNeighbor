<nav class="bottom-nav-container" *ngIf="visivelMobile() || visivelDesktop()">  <div class="nav-pill mobile-nav" *ngIf="visivelMobile()">    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">      <span class="material-symbols-rounded">home</span>      <span class="label">Início</span>    </a>    <a routerLink="/explorar" routerLinkActive="active" class="nav-item">      <span class="material-symbols-rounded">search</span>      <span class="label">Explorar</span>    </a>    <div class="nav-center">      <a routerLink="/meus-pets" class="add-btn" aria-label="Meus Pets">        <span class="material-symbols-rounded">pets</span>      </a>    </div>    <a routerLink="/agenda" routerLinkActive="active" class="nav-item">      <span class="material-symbols-rounded">calendar_month</span>      <span class="label">Agenda</span>    </a>    <a routerLink="/perfil" routerLinkActive="active" class="nav-item">      <span class="material-symbols-rounded">person</span>      <span class="label">Perfil</span>    </a>  </div>  <div class="nav-pill desktop-nav" *ngIf="visivelDesktop()">    <div class="desktop-left">      <div class="desktop-logo" routerLink="/">        <span class="material-symbols-rounded">pets</span>        <span class="logo-text">PetNeighbor</span>      </div>      <div class="greeting-text" *ngIf="supabase.currentUser() as user">        Olá, {{ user.nome.split(' ')[0] }} 👋      </div>      <div class="greeting-text" *ngIf="!supabase.currentUser()">        Olá, visitante 👋      </div>    </div>    <div class="desktop-menu">      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">        <span class="material-symbols-rounded">home</span>        <span class="label">Início</span>      </a>      <a routerLink="/explorar" routerLinkActive="active" class="nav-item">        <span class="material-symbols-rounded">search</span>        <span class="label">Explorar</span>      </a>      <a routerLink="/meus-pets" routerLinkActive="active" class="nav-item">        <span class="material-symbols-rounded">pets</span>        <span class="label">Meus Pets</span>      </a>      <a routerLink="/agenda" routerLinkActive="active" class="nav-item">        <span class="material-symbols-rounded">calendar_month</span>        <span class="label">Agenda</span>      </a>      <a routerLink="/cuide" routerLinkActive="active" class="nav-item" *ngIf="supabase.currentCuidador()">        <span class="material-symbols-rounded">volunteer_activism</span>        <span class="label">Cuide</span>      </a>    </div>    <div class="desktop-right">      <button class="icon-btn chat-btn" routerLink="/conversas" aria-label="Conversas">        <span class="material-symbols-rounded">chat</span>        <span class="notif-badge" *ngIf="chatStore.unreadCount() > 0">          {{ chatStore.unreadCount() > 9 ? '9+' : chatStore.unreadCount() }}        </span>      </button>      <button class="icon-btn notif-btn" routerLink="/notificacoes" aria-label="Notificações">        <span class="material-symbols-rounded">notifications</span>        <span class="notif-badge" *ngIf="notificacaoStore.naoLidas() > 0">          {{ notificacaoStore.naoLidas() > 9 ? '9+' : notificacaoStore.naoLidas() }}        </span>      </button>      <button class="icon-btn profile-btn" routerLink="/perfil" aria-label="Perfil">        <span class="material-symbols-rounded">account_circle</span>      </button>    </div>  </div></nav>
