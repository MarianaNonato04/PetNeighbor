<div class="login-container">
  <header class="header">
    <div class="logo-placeholder">
      <span class="material-symbols-rounded text-terracota" style="font-size: 3.5rem;">pet_supplies</span>
    </div>
    <h1>Entrar</h1>
    <p>Bem-vindo de volta ao <span class="text-terracota">PetNeighbor</span></p>
  </header>

  <div class="glass-card">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="input-field"
          placeholder="seu@email.com"
          [class.invalid]="hasError('email', 'required') || hasError('email', 'email')"
        >
        <div class="error-msg" *ngIf="hasError('email', 'required')">E-mail é obrigatório</div>
        <div class="error-msg" *ngIf="hasError('email', 'email')">E-mail inválido</div>
      </div>

      <!-- Senha -->
      <div class="form-group mt-4">
        <label for="senha">Senha</label>
        <div class="password-input-wrapper">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="senha" 
            formControlName="senha" 
            class="input-field"
            placeholder="Sua senha"
            [class.invalid]="hasError('senha', 'required')"
          >
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            <span class="material-symbols-rounded">
              {{ showPassword() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
        <div class="error-msg" *ngIf="hasError('senha', 'required')">Senha é obrigatória</div>
      </div>

      <button type="submit" class="btn-primary mt-4" [disabled]="isSubmitting()">
        <span *ngIf="!isSubmitting()">Entrar</span>
        <span *ngIf="isSubmitting()">Entrando...</span>
      </button>
    </form>

    <div class="status-messages">
      <div class="error-banner" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>
    </div>

    <div class="footer-link mt-4">
      <p>Não tem uma conta? <a routerLink="/cadastro-usuario">Cadastre-se</a></p>
    </div>
  </div>
</div>
