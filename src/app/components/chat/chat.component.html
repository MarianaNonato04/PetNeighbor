<div class="chat-page">

  <header class="chat-header">
    <button class="back-btn" [routerLink]="linkVoltar" aria-label="Voltar">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <div class="chat-avatar">
      <img *ngIf="fotoContato() as foto" [src]="foto" [alt]="nomeContato()">
      <span *ngIf="!fotoContato()" class="material-symbols-rounded">account_circle</span>
    </div>
    <div class="chat-header-info">
      <h1>{{ nomeContato() || 'Conversa' }}</h1>
      <p><span class="online-dot"></span> Tempo real</p>
    </div>
  </header>

  <div class="chat-scroll" #scrollArea>
    <div *ngIf="isLoading()" class="state-box"><div class="spinner"></div></div>

    <div *ngIf="!isLoading() && mensagens().length === 0" class="chat-empty">
      <span class="material-symbols-rounded">forum</span>
      <p>Inicie a conversa com {{ nomeContato() }}</p>
      <small>Combine detalhes do serviço, tire dúvidas e alinhe horários.</small>
    </div>

    <div class="msg-row" *ngFor="let m of mensagens()"
      [class.msg-row--mine]="ehMinha(m)">
      <div class="msg-bubble">
        <p class="msg-text">{{ m.conteudo }}</p>
        <span class="msg-time">{{ formatHora(m.created_at) }}</span>
      </div>
    </div>
  </div>

  <div class="chat-composer">
    <input
      type="text"
      class="composer-input"
      placeholder="Mensagem..."
      [attr.maxlength]="limites.mensagem"
      [ngModel]="novaMensagem()"
      (ngModelChange)="novaMensagem.set($event)"
      (keyup.enter)="enviar()"
    >
    <button class="send-btn" (click)="enviar()" [disabled]="!novaMensagem().trim() || enviando()" aria-label="Enviar">
      <span class="material-symbols-rounded">send</span>
    </button>
  </div>

</div>
