<div class="auth-page">

  <div class="auth-hero">
    <div class="auth-hero-inner">
      <div class="auth-logo">
        <span class="material-symbols-rounded">pets</span>
      </div>
      <h1>PetNeighbor</h1>
      <p>Crie sua conta grátis</p>
    </div>
    <div class="auth-hero-wave">
      <svg viewBox="0 0 430 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,20 C80,40 160,0 215,20 C270,40 350,0 430,20 L430,40 L0,40 Z" fill="var(--color-areia)"/>
      </svg>
    </div>
  </div>

  <div class="auth-body">
    <div class="auth-card glass-card">

      <h2 class="auth-card-title">Seus dados</h2>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <div class="input-wrapper">
            <span class="input-icon material-symbols-rounded">person</span>
            <input
              type="text"
              id="nome"
              formControlName="nome"
              class="input-field input-with-icon"
              placeholder="Seu nome"
              [class.invalid]="hasError('nome', 'required') || hasError('nome', 'minlength')"
            >
          </div>
          <span class="error-msg" *ngIf="hasError('nome', 'required')">Nome é obrigatório</span>
        </div>

        <div class="form-group">
          <label for="idade">Sua idade</label>
          <div class="input-wrapper">
            <span class="input-icon material-symbols-rounded">cake</span>
            <input
              type="number"
              id="idade"
              formControlName="idade"
              class="input-field input-with-icon"
              placeholder="Ex: 25"
              [class.invalid]="hasError('idade', 'required')"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <span class="input-icon material-symbols-rounded">mail</span>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="input-field input-with-icon"
              placeholder="seu@email.com"
              [class.invalid]="hasError('email', 'required') || hasError('email', 'email')"
            >
          </div>
          <span class="error-msg" *ngIf="hasError('email', 'email')">E-mail inválido</span>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="password-input-wrapper input-wrapper">
            <span class="input-icon material-symbols-rounded">lock</span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="senha"
              formControlName="senha"
              class="input-field input-with-icon"
              placeholder="Mínimo 6 caracteres"
              [class.invalid]="hasError('senha', 'required') || hasError('senha', 'minlength')"
            >
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
              <span class="material-symbols-rounded">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <div class="success-banner" *ngIf="successMessage()" style="margin-top:1rem;">
          {{ successMessage() }}
        </div>
        <div class="error-banner" *ngIf="errorMessage()" style="margin-top:1rem;">
          {{ errorMessage() }}
        </div>

        <button type="submit" class="btn-primary" style="margin-top:1.5rem;" [disabled]="isSubmitting()">
          <span *ngIf="!isSubmitting()">Criar conta</span>
          <span *ngIf="isSubmitting()" style="display:flex;align-items:center;gap:0.5rem;">
            <span class="btn-spinner"></span> Criando conta...
          </span>
        </button>
      </form>

      <p class="auth-switch-text">
        Já tem conta? <a routerLink="/login">Fazer login</a>
      </p>

    </div>
  </div>

</div>
