<div class="register-container">
  <header class="header">
    <div class="logo-placeholder">
      <span class="material-symbols-rounded text-terracota" style="font-size: 3.5rem;">pets</span>
    </div>
    <h1>Bem-vindo!</h1>
    <p>Crie sua conta no <span class="text-terracota" style="font-weight: 600;">PetNeighbor</span></p>
  </header>

  <div class="glass-card">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Nome -->
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input 
          type="text" 
          id="nome" 
          formControlName="nome" 
          class="input-field"
          placeholder="Seu nome"
          [class.invalid]="hasError('nome', 'required') || hasError('nome', 'minlength')"
        >
        <div class="error-msg" *ngIf="hasError('nome', 'required')">Nome é obrigatório.</div>
      </div>

      <!-- Idade -->
      <div class="form-group mt-4">
        <label for="idade">Sua Idade</label>
        <input 
          type="number" 
          id="idade" 
          formControlName="idade" 
          class="input-field"
          placeholder="Sua idade"
          [class.invalid]="hasError('idade', 'required')"
        >
      </div>

      <!-- Email -->
      <div class="form-group mt-4">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="input-field"
          placeholder="exemplo@email.com"
          [class.invalid]="hasError('email', 'required') || hasError('email', 'email')"
        >
        <div class="error-msg" *ngIf="hasError('email', 'email')">E-mail inválido.</div>
      </div>

      <!-- Senha -->
      <div class="form-group mt-4">
        <label for="senha">Senha</label>
        <div class="password-input-wrapper">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="senha" 
            formControlName="senha" 
            class="input-field"
            placeholder="Mínimo 6 caracteres"
            [class.invalid]="hasError('senha', 'required') || hasError('senha', 'minlength')"
          >
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            <span class="material-symbols-rounded">
              {{ showPassword() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary mt-4" [disabled]="isSubmitting()">
        <span *ngIf="!isSubmitting()">Cadastrar</span>
        <span *ngIf="isSubmitting()">Processando...</span>
      </button>
    </form>

    <div class="status-messages">
      <div class="success-banner" *ngIf="successMessage()">
        {{ successMessage() }}
      </div>
      <div class="error-banner" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>
    </div>

    <div class="footer-link mt-4">
      <p>Já tem uma conta? <a routerLink="/login">Faça Login</a></p>
    </div>
  </div>
</div>
