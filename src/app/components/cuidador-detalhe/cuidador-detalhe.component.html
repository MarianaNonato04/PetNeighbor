<div class="detalhe-page">

  <div *ngIf="isLoading()" class="state-box">
    <div class="spinner"></div>
    <p>Carregando...</p>
  </div>

  <div *ngIf="!isLoading() && !cuidador()" class="state-box">
    <p>Cuidador não encontrado.</p>
    <button routerLink="/explorar" class="btn-primary" style="margin-top:1rem;max-width:200px;">Voltar</button>
  </div>

  <ng-container *ngIf="cuidador() as c">

    <div class="detalhe-hero">
      <button class="back-btn" routerLink="/explorar" aria-label="Voltar">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>

      <div class="hero-avatar">
        <img *ngIf="c.foto_url" [src]="c.foto_url" [alt]="c.nome">
        <span *ngIf="!c.foto_url" class="material-symbols-rounded">account_circle</span>
      </div>
      <h1 class="hero-name">
        {{ c.nome }}
        <span class="material-symbols-rounded verified" *ngIf="c.verificado" title="Verificado">verified</span>
      </h1>
      <p class="hero-cidade">
        <span class="material-symbols-rounded">location_on</span>{{ c.cidade }}
      </p>
    </div>

    <div class="page-body">

      <div class="glass-card">
        <h2 class="section-label">Sobre</h2>
        <p class="bio-text">{{ c.bio }}</p>
      </div>

      <div class="glass-card">
        <h2 class="section-label">Serviços oferecidos</h2>
        <div class="servico-row" *ngFor="let s of c.servicos">
          <div class="servico-icon">
            <span class="material-symbols-rounded">{{
              s === 'Passeio' ? 'directions_walk' : s === 'Alimentação' ? 'restaurant' : 'favorite'
            }}</span>
          </div>
          <span class="servico-nome">{{ s }}</span>
          <span class="servico-preco">R$ {{ precoDe(c, s) }} / hora</span>
        </div>
      </div>

      <div class="glass-card map-card" *ngIf="mapUrl()">
        <h2 class="section-label">Região de atuação</h2>
        <div class="map-container">
          <iframe
            [src]="mapUrl()!"
            width="100%"
            height="250"
            style="border:0; border-radius: var(--radius-md);"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn-outline-action" (click)="conversar()">
        <span class="material-symbols-rounded">chat</span>
        Conversar
      </button>
      <button class="btn-primary" (click)="agendar()">
        <span class="material-symbols-rounded">event</span>
        Agendar serviço
      </button>
    </div>
  </ng-container>

</div>
