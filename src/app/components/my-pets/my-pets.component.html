<div class="my-pets-container">
  <header class="header">
    <h1>Meus Pets</h1>
    <p>Veja seus amiguinhos cadastrados</p>
  </header>

  <div class="content" *ngIf="isUserLoggedIn(); else loginRequired">
    <div *ngIf="isLoading()" class="loading-state">
      <div class="spinner"></div>
      <p>Carregando seus pets...</p>
    </div>

    <div *ngIf="!isLoading() && pets().length === 0" class="empty-state">
      <div class="glass-card">
        <span class="material-symbols-rounded empty-icon">sentiment_dissatisfied</span>
        <p>vc não possui nenhum pet cadastrado</p>
        <button routerLink="/cadastro-pet" class="btn-primary mt-4">Adicionar Pet</button>
      </div>
    </div>

    <div class="pet-list" *ngIf="!isLoading() && pets().length > 0">
      <div class="pet-card glass-card" *ngFor="let pet of pets()">
        <div class="pet-image-placeholder">
          <span class="material-symbols-rounded">pet_supplies</span>
        </div>
        
        <div class="pet-info">
          <div class="pet-header">
            <h3 class="pet-name">{{ pet.nome_pet }}</h3>
            <span class="porte-badge">{{ pet.porte }}</span>
          </div>
          <p class="pet-details">
            <span>{{ pet.idade_pet }} anos</span> • <span>{{ pet.peso }}kg</span>
          </p>
          <p class="pet-desc">{{ pet.describ_pet }}</p>
        </div>
      </div>
      
      <button routerLink="/cadastro-pet" class="btn-secondary mt-4 w-full">
        + Cadastrar outro pet
      </button>
    </div>
  </div>

  <ng-template #loginRequired>
    <div class="glass-card text-center">
      <p class="mb-2">Você precisa estar logado para ver seus pets.</p>
      <button routerLink="/cadastro-usuario" class="btn-primary">Fazer Cadastro</button>
    </div>
  </ng-template>
</div>
