name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hrfestijxvifjgtmcxan.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_rpEaVx5nlKopfuGxkh5uxg_YO8iKyrQ' }}

    steps:
      - name: Ping Supabase database
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/cuidadores?select=id_cuidador&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "HTTP status: $status"
          cat response.json; echo

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Falha ao pingar o Supabase (HTTP $status)"
            exit 1
          fi
